# Open the version-bump PR that precedes a release.
#
# Releasing is: run this → open, review and merge the pull request it prepares → create the GitHub
# Release on tag vX.Y.Z. The tag is what decides the published version (see release.yml), so this
# workflow does not control what ships — it keeps the repo's own copy of the number honest, and gives
# the release a reviewable commit to point at.
#
# ── Why a branch and a review, and not a direct commit ──────────────────────────────────────────
# `main` requires a reviewed pull request, and the only bypass is an organization admin. GitHub refuses
# to exempt the Actions app at repository level — it wants an organization ruleset, which needs a paid
# plan — and the Actions bot holds the write role, not admin, so a repository-role bypass would not
# apply to it either. The remaining ways to push straight to `main` all mean storing a long-lived
# credential (a GitHub App's private key, or a PAT), which is exactly what the OIDC publishing setup
# exists to avoid. Pushing a branch needs neither a bypass nor a secret.
#
# ── Forgetting to run this is not an error ──────────────────────────────────────────────────────
# release.yml takes the version from the tag regardless, so a release cut without this step still
# publishes the right number; package.json is merely stale until the next bump. That is deliberate.
# The alternative — asserting the tag matches package.json — turns a forgotten step into a failed
# release, and immutable releases mean a failed release burns its version number permanently.
name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true
        type: string

# Enough to push a branch, and nothing else. `main` itself stays untouchable, and the pull request is
# opened by a human — see the note at the end of the bump step for why that is deliberate rather than
# a limitation worked around.
permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'mega-yfue/eufy-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0

      # Same shape release.yml enforces on the tag, minus the `v`. Rejecting a leading zero matters
      # because `npm version` accepts `01.2.3` and publishes something nobody can install by the name
      # they expect.
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$VERSION' is not X.Y.Z — pass the version without the leading v"
            exit 1
          fi

      # Catch a taken version here, while it is still a rejected input, rather than after a bump PR has
      # been reviewed and merged for a release that can never be cut.
      #
      # PARTIAL BY CONSTRUCTION: this sees tags that exist. A tag that once belonged to a release and
      # was then deleted stays reserved forever under immutable releases, and nothing exposes that
      # ledger — v0.0.2 reads as free here and is still refused by GitHub. So a clean result means
      # "not obviously taken", not "available". Bump past a number you know was burned.
      - name: Refuse a version that is already taken
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists — a released version number cannot be reused"
            exit 1
          fi

      - name: Bump the version and push the branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore(release): $VERSION

          Prepares the release. The published version comes from the \`v$VERSION\` tag, not from this
          file — this keeps the repository's own copy of the number in step with the registry.

          Co-authored-by: max246 <1809444+max246@users.noreply.github.com>
          Co-authored-by: lenoxys <3996456+lenoxys@users.noreply.github.com>
          Co-authored-by: Martijn Poppen <7694138+martijnpoppen@users.noreply.github.com>"

          git push --set-upstream origin "$branch"

          # The pull request is opened by a human, on purpose. Actions cannot create one here — the
          # organization disallows it — and the setting that would allow it is the same one that lets a
          # workflow APPROVE a pull request. Turning it on would let a workflow satisfy `main`'s review
          # requirement by itself, which is the protection this whole flow exists to respect. One click
          # is a fair price.
          {
            echo "## Release $VERSION prepared"
            echo
            echo "**[Open the pull request](https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)** — branch \`$branch\`."
            echo
            echo "Once it is reviewed and merged, create the GitHub Release on tag \`v$VERSION\`"
            echo "targeting \`main\`. That is what publishes: the tag decides the version, and the"
            echo "release job runs the full gate before anything reaches npm."
            echo
            echo "Do not create the tag by hand. Immutable releases are enabled, so a tag name is spent"
            echo "the moment it belongs to a release, and pushing a release tag with git is refused."
          } >> "$GITHUB_STEP_SUMMARY"
