# Open the version-bump PR that precedes a release.
#
# Releasing is: run this → review and merge the PR → create the GitHub Release on tag vX.Y.Z. The tag
# is what decides the published version (see release.yml), so this workflow does not control what
# ships — it keeps the repo's own copy of the number honest, and gives the release a reviewable commit
# to point at.
#
# ── Why a PR and not a direct commit ────────────────────────────────────────────────────────────
# `main` requires a reviewed pull request, and the only bypass is an organization admin. GitHub
# refuses to exempt the Actions app at repository level — it wants an organization ruleset, which
# needs a paid plan — and the Actions bot holds the write role, not admin, so a repository-role bypass
# would not apply to it either. The remaining ways to push straight to `main` all mean storing a
# long-lived credential (a GitHub App's private key, or a PAT), which is exactly what the OIDC
# publishing setup exists to avoid. A branch push plus a PR needs no bypass and no secret, so that is
# what this does.
#
# ── Forgetting to run this is not an error ──────────────────────────────────────────────────────
# release.yml takes the version from the tag regardless, so a release cut without this step still
# publishes the right number; package.json is merely stale until the next bump. That is deliberate.
# The alternative — asserting the tag matches package.json — turns a forgotten step into a failed
# release, and immutable releases mean a failed release burns its version number permanently.
name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true
        type: string

# Enough to push a branch and open a pull request, and nothing else. `main` itself stays untouchable.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'mega-yfue/eufy-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0

      # Same shape release.yml enforces on the tag, minus the `v`. Rejecting a leading zero matters
      # because `npm version` accepts `01.2.3` and publishes something nobody can install by the name
      # they expect.
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$VERSION' is not X.Y.Z — pass the version without the leading v"
            exit 1
          fi

      # Catch a taken version here, while it is still a rejected input, rather than after a bump PR has
      # been reviewed and merged for a release that can never be cut.
      #
      # PARTIAL BY CONSTRUCTION: this sees tags that exist. A tag that once belonged to a release and
      # was then deleted stays reserved forever under immutable releases, and nothing exposes that
      # ledger — v0.0.2 reads as free here and is still refused by GitHub. So a clean result means
      # "not obviously taken", not "available". Bump past a number you know was burned.
      - name: Refuse a version that is already taken
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists — a released version number cannot be reused"
            exit 1
          fi

      - name: Bump and open the pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore(release): $VERSION

          Prepares the release. The published version comes from the \`v$VERSION\` tag, not from this
          file — this keeps the repository's own copy of the number in step with the registry.

          Co-authored-by: max246 <1809444+max246@users.noreply.github.com>
          Co-authored-by: lenoxys <3996456+lenoxys@users.noreply.github.com>
          Co-authored-by: Martijn Poppen <7694138+martijnpoppen@users.noreply.github.com>"

          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): $VERSION" \
            --body "Version bump ahead of \`v$VERSION\`. Opened by the \`prepare release\` workflow.

          **After merging**, create the GitHub Release on tag \`v$VERSION\` targeting \`main\`. That is
          what publishes: the tag decides the version, and the release job runs the full gate before
          anything reaches npm.

          Do not create the tag by hand — immutable releases are enabled, so a tag name is spent the
          moment it belongs to a release, and \`git push\` of a release tag is refused outright."
