# Publish @mega-yfue/eufy-sdk to npm.
#
# Three channels, one job:
#   latest  — a published GitHub Release on tag vX.Y.Z. The version is whatever package.json says;
#             the tag is documentation, not the source of the number.
#   beta    — a push to a `beta-X.Y.Z` branch
#   alpha   — a push to an `alpha-X.Y.Z` branch
#
# A prerelease branch sets the base version from its OWN NAME and appends a prerelease suffix
# (`beta-1.2.3` → 1.2.3-beta.0, .1, … on each push). Nothing is committed back — the bump is local to
# the runner, so the branch name stays the single source of the base version and cannot drift from
# package.json the way a committed bump would.
#
# ── Credentials: npm OIDC trusted publishing, NOT a token ───────────────────────────────────────
# There is no NPM_TOKEN. The runner mints a short-lived OIDC identity that npm verifies against the
# trusted publisher configured on the package (npmjs.com → the package → Settings → Trusted
# publishers: this repository + this workflow filename). Nothing long-lived is stored in this repo, so
# there is no token to leak, rotate, or expire. It requires npm ≥ 11.5.1, which is why the toolchain
# npm is upgraded below, and `id-token: write` in the permissions block.
#
# `--provenance` publishes a signed attestation linking the tarball to this workflow run and commit,
# which npm shows on the package page. It needs the same `id-token: write`.
#
# ── Actions pinned to full-length commit SHAs ───────────────────────────────────────────────────
# A tag is mutable — the action's owner can move `v7` onto different code and this workflow would run
# it, here, with publish rights in scope. A SHA makes an update a reviewable diff. Dependabot rewrites
# the SHA and the trailing `# vX.Y.Z` comment together.
name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - beta-*.*.*
      - alpha-*.*.*

# `contents: read` — the release notes are written by hand on the GitHub Release, not generated here.
permissions:
  id-token: write
  contents: read

# Never cancel an in-flight publish: a killed job can leave the registry half-updated.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A fork must not publish, and a GitHub Release flagged `prerelease` must not land on the `latest`
    # dist-tag — use a beta/alpha branch for that instead.
    if: >-
      github.repository == 'mega-yfue/eufy-sdk'
      && !(github.event_name == 'release' && github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24.5.0 predates it.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The same gate CI runs. A release is the one place where skipping it is unrecoverable: an npm
      # version cannot be re-published, only deprecated.
      - name: Verify (npm run verify)
        run: npm run verify

      - name: Resolve the release channel
        id: channel
        run: |
          case "${{ github.ref }}" in
            refs/heads/beta-*)  echo "tag=beta"   >> "$GITHUB_OUTPUT" ;;
            refs/heads/alpha-*) echo "tag=alpha"  >> "$GITHUB_OUTPUT" ;;
            *)                  echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # `beta-1.2.3` → set 1.2.3, then append the prerelease suffix (1.2.3-beta.0). --no-git-tag-version
      # keeps it local to the runner: nothing is committed or tagged.
      - name: Apply the prerelease version
        if: steps.channel.outputs.tag != 'latest'
        run: |
          base="${GITHUB_REF_NAME#*-}"
          npm version "$base" --no-git-tag-version --allow-same-version
          npm version pre --preid="${{ steps.channel.outputs.tag }}" --no-git-tag-version

      # Inspect what actually ships before it ships — `files` is dist/ only, so a stray path in the
      # tarball listing is the signal that something leaked into the package.
      - name: Inspect the tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --tag ${{ steps.channel.outputs.tag }} --provenance --access public
